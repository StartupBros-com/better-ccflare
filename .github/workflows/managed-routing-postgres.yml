name: Managed Routing Foundation Gate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  managed-routing-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: better_ccflare_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d better_ccflare_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Exact version from .bun-version, the single source of truth for every
          # workflow that installs Bun. `latest` moved underneath this gate once
          # (#231/#232) and the unpin in #319 reopened that exposure (#321): the
          # Bun Latest Canary workflow runs these same steps on `latest` and files
          # an issue on drift, so a bump is a deliberate edit to .bun-version
          # (procedure: docs/contributing.md, "Bumping the Bun toolchain").
          bun-version-file: .bun-version

      - name: Verify the installed Bun matches .bun-version
        # setup-bun only warns and falls back to `latest` if the file is missing.
        run: test "$(bun --version)" = "$(tr -d '[:space:]' < .bun-version)"

      - name: Run the managed-routing gate
        uses: ./.github/actions/managed-routing-gate
