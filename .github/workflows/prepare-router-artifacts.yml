name: Prepare wstack Router Artifacts

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: .bun-version
          no-cache: true
          token: ''

      - name: Verify the installed Bun matches .bun-version
        # setup-bun otherwise falls back to latest when the file is missing.
        run: test "$(bun --version)" = "$(tr -d '[:space:]' < .bun-version)"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prepare and verify unpublished Linux artifacts
        run: |
          printf '%s\n' 'Local ephemeral preparation only; not release publication. No artifacts are uploaded or retained.'
          preparation_root="$(mktemp -d "$RUNNER_TEMP/wstack-router.XXXXXX")"
          bun run apps/cli/prepare-router-artifacts.ts "$preparation_root/artifacts"
