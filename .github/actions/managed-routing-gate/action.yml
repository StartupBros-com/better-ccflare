name: Managed Routing Foundation Gate steps
description: >-
  Install, build, test, lint, typecheck, format and clean-checkout steps of the
  Managed Routing Foundation Gate, shared by managed-routing-postgres.yml
  (blocking, Bun pinned by .bun-version) and bun-latest-canary.yml (non-blocking,
  Bun latest) so the canary exercises exactly what the gate does (#321). The
  calling job must provide the postgres:16 service on localhost:5432 and Bun on
  PATH.
runs:
  using: composite
  steps:
    - name: Install dependencies
      run: bun install --frozen-lockfile
      shell: bash

    - name: Build CLI generated modules
      run: bun run build:cli
      shell: bash

    - name: Build dashboard generated modules
      run: bun run build:dashboard
      shell: bash

    - name: Run focused managed-routing database tests
      run: >-
        bun test
        packages/database/src/__tests__/managed-routing-migrations.test.ts
        packages/database/src/adapters/__tests__/bun-sql-adapter-batch.test.ts
        packages/database/src/repositories/__tests__/combo-managed-policy.test.ts
        packages/database/src/repositories/__tests__/combo-priority.test.ts
      shell: bash

    - name: Run must-run PostgreSQL migration tests
      env:
        # This is the disposable loopback service above. The test name is part
        # of the guard contract; do not replace with an ambient DATABASE_URL.
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/better_ccflare_test
        CCFLARE_REQUIRE_LIVE_PG_MIGRATIONS: "true"
      run: |
        test "${DATABASE_URL#*://*:*@}" = "localhost:5432/better_ccflare_test"
        bun test --timeout 15000 packages/database/src/migrations-pg.test.ts
      shell: bash

    - name: Run focused PostgreSQL integration tests
      env:
        BETTER_CCFLARE_TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/better_ccflare_test
      run: >-
        bun test
        packages/database/src/__tests__/managed-routing-postgres.integration.test.ts
        packages/database/src/repositories/__tests__/server-tool-replay-issuance.repository.test.ts
        packages/http-api/src/__tests__/pg-live-queries.test.ts
      shell: bash

    - name: Run full test suite
      run: |
        for root in apps packages scripts tests; do
          if [[ ! -d "$root" ]]; then
            echo "::error::Test root is missing: $root"
            exit 1
          fi
        done

        # pg-live-queries.test.ts already ran above against a live database
        # (its live block is gated on BETTER_CCFLARE_TEST_POSTGRES_URL /
        # DATABASE_URL and fails loudly in CI if neither is set — see the
        # file's own guard). Excluded here so it isn't also run a second
        # time in this loop's bare env, where it would have neither var and
        # correctly abort the whole step.
        mapfile -d '' -t test_files < <(
          find apps packages scripts tests -type f \
            \( -name '*.test.ts' -o -name '*.test.tsx' -o -name '*.spec.ts' -o -name '*.spec.tsx' \) \
            -not -path '*/http-api/src/__tests__/pg-live-queries.test.ts' \
            -print0 | LC_ALL=C sort -z
        )

        if (( ${#test_files[@]} == 0 )); then
          echo "::error::No test files found"
          exit 1
        fi

        echo "Running ${#test_files[@]} test files in isolated Bun processes"
        failures=()
        for test_file in "${test_files[@]}"; do
          printf '\n==> %s\n' "$test_file"
          if ! bun test --timeout 15000 "$test_file"; then
            failures+=("$test_file")
          fi
        done

        if (( ${#failures[@]} > 0 )); then
          printf '\n::error::%d isolated test file(s) failed\n' "${#failures[@]}"
          printf '  %q\n' "${failures[@]}"
          exit 1
        fi

        printf '\nAll %d isolated test files passed\n' "${#test_files[@]}"
      shell: bash

    - name: Run lint
      run: bun run lint
      shell: bash

    - name: Run typecheck
      run: bun run typecheck
      shell: bash

    - name: Run format
      run: bun run format
      shell: bash

    - name: Verify lint and format left the checkout clean
      run: |
        git diff --check
        git diff --exit-code
        test -z "$(git status --porcelain)"
      shell: bash
